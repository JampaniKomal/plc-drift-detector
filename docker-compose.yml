services:
  engine:
    build: .
    command: python -m engine.monitor
    volumes:
      - ./plc_config:/app/plc_config
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - WATCH_DIR=/app/plc_config
      - BASELINE_FILE=/app/plc_config/baseline.xml
      - LOG_DIR=/app/logs
      # Demo-only value for local `docker-compose up`. A real deployment
      # must supply its own secret (e.g. via a secrets manager or .env
      # file that is not committed) - never reuse this value.
      - OT_GUARD_SECRET_KEY=demo-local-only-do-not-use-in-production

  ui:
    build: .
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - LOG_DIR=/app/logs

  attacker:
    build: .
    command: python tools/simulate_attack.py
    volumes:
      - ./plc_config:/app/plc_config
    profiles:
      - tools
    environment:
      - WATCH_DIR=/app/plc_config
